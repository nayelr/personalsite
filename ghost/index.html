<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A concise hardware engineering brief from Nayel Rehman for Ghost." />
    <meta name="theme-color" content="#06080b" />
    <title>Nayel Rehman × Ghost</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080b'/%3E%3Cpath d='M8 21V11l4-4h12v18H12z' fill='%2311161d' stroke='%23dcecff'/%3E%3Cpath d='M8 21h4V11L8 15z' fill='%23e9f5ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --night: #06080b;
        --ink: #f5f7fa;
        --muted: #aab2bd;
        --glow: #dcecff;
        --blue: #78b8ff;
        --line: rgba(220, 236, 255, 0.16);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html { background: var(--night); }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 82% 14%, rgba(120, 184, 255, 0.14), transparent 28rem),
          linear-gradient(rgba(220, 236, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(220, 236, 255, 0.035) 1px, transparent 1px),
          var(--night);
        background-size: auto, 48px 48px, 48px 48px, auto;
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.74fr);
        align-items: center;
        gap: clamp(48px, 7vw, 98px);
        padding: 18px 0;
      }

      h1 {
        max-width: 760px;
        margin: 0 0 24px;
        font-size: clamp(3.35rem, 6.8vw, 6.45rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.89;
      }

      h1 em {
        color: var(--blue);
        font-weight: 400;
      }

      .lede {
        max-width: 660px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 1.62vw, 1.29rem);
        line-height: 1.48;
      }

      .lede strong {
        color: var(--glow);
        font-weight: 500;
      }

      .ask {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 18px;
        border: 1px solid var(--glow);
        color: var(--night);
        background: var(--glow);
        font: 600 0.75rem/1 var(--sans);
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .ask:hover,
      .ask:focus-visible {
        color: var(--glow);
        background: transparent;
        box-shadow: 0 0 28px rgba(120, 184, 255, 0.18);
      }

      .portrait {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 rgba(220, 236, 255, 0.9);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: clamp(430px, 63vh, 560px);
        object-fit: cover;
        object-position: center 37%;
      }

      @media (max-width: 820px) {
        .page { width: min(100% - 30px, 680px); }
        main { grid-template-columns: 1fr; gap: 40px; padding: 46px 0 52px; }
        h1 { max-width: 630px; font-size: clamp(3.05rem, 13vw, 5.25rem); }
        .portrait { box-shadow: 7px 7px 0 rgba(220, 236, 255, 0.9); }
        .portrait img {
          height: auto;
          object-fit: contain;
          object-position: center;
        }
      }

      @media (max-width: 430px) {
        .lede { font-size: 1.05rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ask { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section>
          <h1>Let me help build the computer <em>personal AI deserves.</em></h1>
          <p class="lede">
            as a local model enthusiast myself, i think ghost is the perfect way to approach democratizing them, and i'd love to help.
          </p>
          <a class="ask" href="https://www.nayelr.com/">View main site</a>
        </section>

        <figure class="portrait">
          <img src="/ghost/assets/nayel-ghost-portrait.png" alt="Nayel Rehman testing electronics beside the Ghost Core personal AI computer" width="1120" height="1400" loading="eager" />
        </figure>
      </main>
    </div>
  </body>
</html>
