<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A concise engineering brief from Nayel Rehman for Ultrasonium." />
    <meta name="theme-color" content="#f8faff" />
    <title>Nayel Rehman × Ultrasonium</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235c8ff2' d='M16 2 29 9v14l-13 7L3 23V9z'/%3E%3Cpath fill='%23b9d2ff' d='m16 2 13 7-13 7L3 9z'/%3E%3Cpath fill='%23365fae' d='M16 16v14L3 23V9z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f8faff;
        --ink: #0a1020;
        --muted: #596579;
        --blue: #4f7fe0;
        --blue-dark: #294f9b;
        --line: rgba(25, 48, 91, 0.14);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 10%, rgba(79, 127, 224, 0.13), transparent 30rem),
          linear-gradient(rgba(25, 48, 91, 0.038) 1px, transparent 1px),
          linear-gradient(90deg, rgba(25, 48, 91, 0.038) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 44px 44px, 44px 44px, auto;
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1160px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.72fr);
        align-items: center;
        gap: clamp(48px, 7vw, 96px);
        padding: 10px 0;
      }

      h1 {
        max-width: 760px;
        margin: 0 0 22px;
        font-size: clamp(3.35rem, 6.8vw, 6.35rem);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.89;
      }

      h1 em {
        color: var(--blue);
        font-weight: 400;
      }

      .lede {
        max-width: 650px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 1.65vw, 1.3rem);
        line-height: 1.48;
      }

      .ask {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 18px;
        border: 1px solid var(--blue);
        color: #fff;
        background: var(--blue);
        font: 600 0.75rem/1 var(--sans);
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 150ms ease, color 150ms ease;
      }

      .ask:hover,
      .ask:focus-visible {
        color: var(--blue-dark);
        background: transparent;
      }

      .portrait {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 rgba(79, 127, 224, 0.92);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: clamp(400px, 60vh, 520px);
        object-fit: cover;
        object-position: center 30%;
      }

      @media (max-width: 820px) {
        .page { width: min(100% - 30px, 680px); }
        main { grid-template-columns: 1fr; gap: 40px; padding: 46px 0 52px; }
        h1 { max-width: 620px; font-size: clamp(3.05rem, 13vw, 5.25rem); }
        .portrait { box-shadow: 7px 7px 0 rgba(79, 127, 224, 0.92); }
        .portrait img {
          height: auto;
          object-fit: contain;
          object-position: center;
        }
      }

      @media (max-width: 430px) {
        .lede { font-size: 1.05rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ask { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section>
          <h1>Let me help make Ultrasonium the <em>new standard for metal.</em></h1>
          <p class="lede">
            I believe the next generation of rockets, reactors, and robots will be built with manufacturing breakthroughs like Ultrasonium’s, and I’d love to help scale it.
          </p>
          <a class="ask" href="https://www.nayelr.com/">View main site</a>
        </section>

        <figure class="portrait">
          <img src="/ultrasonium/assets/nayel-ultrasonium-portrait.jpg" alt="Nayel Rehman inspecting a precision metal component in an advanced manufacturing lab" width="1120" height="1400" loading="eager" />
        </figure>
      </main>
    </div>
  </body>
</html>
