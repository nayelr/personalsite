<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A concise agricultural hardware brief from Nayel Rehman for Powerus Harvest." />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Nayel Rehman × Powerus Harvest</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182b1f'/%3E%3Cpath d='M8 22c6-1 10-5 16-13-1 8-5 14-12 15' fill='none' stroke='%23f1c84b' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M9 16c4 0 7 2 9 6-5 0-8-2-9-6z' fill='%23f7f8f3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f7f8f3;
        --ink: #182b1f;
        --muted: #56645a;
        --leaf: #2d6a3f;
        --harvest: #f1c84b;
        --line: rgba(24, 43, 31, 0.14);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 78% 8%, rgba(241, 200, 75, 0.22), transparent 30rem),
          linear-gradient(rgba(24, 43, 31, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 43, 31, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 46px 46px, 46px 46px, auto;
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.74fr);
        align-items: center;
        gap: clamp(48px, 7vw, 98px);
        padding: 18px 0;
      }

      h1 {
        max-width: 760px;
        margin: 0 0 24px;
        font-size: clamp(3.35rem, 6.8vw, 6.45rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.89;
      }

      h1 em {
        color: var(--leaf);
        font-weight: 400;
      }

      .lede {
        max-width: 660px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 1.62vw, 1.29rem);
        line-height: 1.48;
      }

      .ask {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        color: var(--paper);
        background: var(--ink);
        font: 600 0.75rem/1 var(--sans);
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .ask:hover,
      .ask:focus-visible {
        color: var(--ink);
        background: transparent;
        box-shadow: 0 0 28px rgba(45, 106, 63, 0.14);
      }

      .portrait {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 var(--harvest);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: clamp(430px, 63vh, 560px);
        object-fit: cover;
        object-position: center 34%;
      }

      @media (max-width: 820px) {
        .page { width: min(100% - 30px, 680px); }
        main { grid-template-columns: 1fr; gap: 40px; padding: 46px 0 52px; }
        h1 { max-width: 630px; font-size: clamp(3.05rem, 13vw, 5.25rem); }
        .portrait { box-shadow: 7px 7px 0 var(--harvest); }
        .portrait img {
          height: auto;
          object-fit: contain;
          object-position: center;
        }
      }

      @media (max-width: 430px) {
        .lede { font-size: 1.05rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ask { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section>
          <h1>let me help make Harvest the <em>workhorse of american agriculture.</em></h1>
          <p class="lede">
            a 1,000-pound-class autonomous platform for spraying, seeding, and crop intelligence is exactly the kind of hardware i want to help build
          </p>
          <a class="ask" href="https://www.nayelr.com/">View main site</a>
        </section>

        <figure class="portrait">
          <img src="/power/assets/nayel-power-harvest-portrait.png" alt="Nayel Rehman beside a heavy-lift agricultural spray drone in a crop field" width="1120" height="1400" loading="eager" />
        </figure>
      </main>
    </div>
  </body>
</html>
