<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nayel Rehman wants to help Amca restore America’s ability to engineer anything." />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Nayel Rehman × Amca</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="icon" href="/public/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f4f1e9;
        --ink: #090909;
        --muted: #57534c;
        --red: #ff3b30;
        --line: rgba(9, 9, 9, 0.16);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 84% 9%, rgba(255, 59, 48, 0.15), transparent 28rem),
          linear-gradient(rgba(9, 9, 9, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(9, 9, 9, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 46px 46px, 46px 46px, auto;
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1220px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
        place-items: center;
      }

      main {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.72fr);
        align-items: center;
        gap: clamp(48px, 7vw, 104px);
        padding: 34px 0;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(3.55rem, 6.9vw, 6.55rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.88;
      }

      h1 em {
        color: var(--red);
        font-weight: 400;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .primary {
        min-height: 48px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        color: var(--paper);
        background: var(--ink);
        font: 600 0.74rem/1 var(--sans);
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .primary:hover,
      .primary:focus-visible {
        color: var(--ink);
        background: transparent;
        box-shadow: 0 0 28px rgba(255, 59, 48, 0.16);
      }

      .portrait {
        position: relative;
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 var(--red);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: clamp(490px, 71vh, 660px);
        object-fit: cover;
        object-position: center 38%;
      }

      .portrait figcaption {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 14px 16px;
        color: white;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
        font: 500 0.68rem/1.2 var(--sans);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      @media (max-width: 900px) {
        .page { width: min(100% - 32px, 700px); }
        main { grid-template-columns: 1fr; gap: 42px; padding: 48px 0 56px; }
        h1 { max-width: 680px; font-size: clamp(3.25rem, 13vw, 5.7rem); }
        .portrait { box-shadow: 7px 7px 0 var(--red); }
        .portrait img { height: auto; object-fit: contain; object-position: center; }
      }

      @media (max-width: 560px) {
        .actions { align-items: flex-start; flex-direction: column; gap: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .primary { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section>
          <h1>i want to help restore america’s ability to <em>engineer anything</em></h1>

          <div class="actions">
            <a class="primary" href="https://www.nayelr.com/">see what i’ve built</a>
          </div>
        </section>

        <figure class="portrait">
          <img src="/amca/assets/nayel-amca-flight-hardware.png" alt="Nayel Rehman debugging aerospace electrical hardware on a lab bench" width="1536" height="2048" loading="eager" />
          <figcaption>concept → bench → flight qualification</figcaption>
        </figure>
      </main>
    </div>
  </body>
</html>
