<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A concise electrical engineering brief from Nayel Rehman for Amca." />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Nayel Rehman × Amca</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff3b30'/%3E%3Cpath d='M7 24 18 8h7v16h-6v-7L14 24z' fill='%23000'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f4f1e9;
        --ink: #090909;
        --muted: #57534c;
        --red: #ff3b30;
        --line: rgba(9, 9, 9, 0.15);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Inter", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 82% 12%, rgba(255, 59, 48, 0.16), transparent 29rem),
          linear-gradient(rgba(9, 9, 9, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(9, 9, 9, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 46px 46px, 46px 46px, auto;
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.74fr);
        align-items: center;
        gap: clamp(48px, 7vw, 98px);
        padding: 18px 0;
      }

      h1 {
        max-width: 780px;
        margin: 0 0 24px;
        font-size: clamp(3.35rem, 6.8vw, 6.45rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.89;
      }

      h1 em {
        color: var(--red);
        font-weight: 400;
      }

      .lede {
        max-width: 680px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 1.62vw, 1.29rem);
        line-height: 1.48;
      }

      .ask {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        color: var(--paper);
        background: var(--ink);
        font: 600 0.75rem/1 var(--sans);
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .ask:hover,
      .ask:focus-visible {
        color: var(--ink);
        background: transparent;
        box-shadow: 0 0 28px rgba(255, 59, 48, 0.16);
      }

      .portrait {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 var(--red);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: clamp(430px, 63vh, 560px);
        object-fit: cover;
        object-position: center 38%;
      }

      @media (max-width: 820px) {
        .page { width: min(100% - 30px, 680px); }
        main { grid-template-columns: 1fr; gap: 40px; padding: 46px 0 52px; }
        h1 { max-width: 650px; font-size: clamp(3.05rem, 13vw, 5.25rem); }
        .portrait { box-shadow: 7px 7px 0 var(--red); }
        .portrait img {
          height: auto;
          object-fit: contain;
          object-position: center;
        }
      }

      @media (max-width: 430px) {
        .lede { font-size: 1.05rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ask { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section>
          <h1>let me help take amca hardware from <em>concept to flight qualification.</em></h1>
          <p class="lede">
            owning a real electrical design, putting it on the bench, and debugging it down to root cause is exactly how i want to spend summer 2027
          </p>
          <a class="ask" href="https://www.nayelr.com/">view main site</a>
        </section>

        <figure class="portrait">
          <img src="/amca/assets/nayel-amca-flight-hardware.png" alt="Nayel Rehman debugging aerospace electrical hardware on a lab bench" width="1536" height="2048" loading="eager" />
        </figure>
      </main>
    </div>
  </body>
</html>
